services:
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 8080
    container_name: cw-api-gateway
    ports:
      - "8080:8080"
    environment:
        HTTP_PORT: "${HTTP_PORT:-8080}"
        AUTH_SERVICE_ADDR: "auth-service:${AUTH_SERVICE_PORT:-50051}"
        MODE: "prod"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  auth-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
        SERVICE_PORT: 50051
    container_name: cw-auth-service
    expose:
      - "50051"
    environment:
        GRPC_PORT: 50051
        JWT_SECRET: "${JWT_SECRET:-defaultJWTSecret}"
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    external: true
    name: cwb_default